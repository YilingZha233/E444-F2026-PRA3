{% extends "base.html" %} {% block title %}PRA3 Docker Chatbot{% endblock %} {%
block page_content %}

<div class="page-header">
  <h1>Hello {{ name }}! Welcome to PRA3 Docker!</h1>
  <p>This chatbot can remember information during your session.</p>
</div>

<div class="panel panel-default">
  <div class="panel-heading">
    <strong>Chatbot</strong>
  </div>

  <div
    id="chat-messages"
    class="panel-body"
    style="height: 300px; overflow-y: auto"
  ></div>

  <div class="panel-footer">
    <div class="input-group">
      <input
        type="text"
        id="message-input"
        class="form-control"
        placeholder="Type your message..."
      />

      <span class="input-group-btn">
        <button id="send-button" class="btn btn-primary" type="button">
          Send
        </button>
      </span>
    </div>

    <br />

    <a href="{{ url_for('logout') }}" class="btn btn-danger"> Logout </a>
  </div>
</div>

<script>
  const messageInput = document.getElementById("message-input");
  const sendButton = document.getElementById("send-button");
  const chatMessages = document.getElementById("chat-messages");

  function addMessage(sender, message) {
    const messageElement = document.createElement("p");

    const senderElement = document.createElement("strong");
    senderElement.textContent = sender + ": ";

    messageElement.appendChild(senderElement);
    messageElement.appendChild(document.createTextNode(message));

    chatMessages.appendChild(messageElement);

    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function sendMessage() {
    const message = messageInput.value.trim();

    if (!message) {
      return;
    }

    addMessage("You", message);

    messageInput.value = "";
    messageInput.focus();

    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        message: message,
      }),
    });

    const data = await response.json();

    addMessage("Bot", data.reply);
  }

  sendButton.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>

{% endblock %}
